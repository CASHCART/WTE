
<!DOCTYPE html>
<html>
<head>
    <title>Scientific Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }

        .calculator {
            width: 320px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            width: 80px;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>Scientific Calculator</h2>

        <input type="number" id="num1" placeholder="First Number">
        <input type="number" id="num2" placeholder="Second Number">

        <br>

        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">-</button>
        <button onclick="calculate('*')">*</button>
        <button onclick="calculate('/')">/</button>

        <br>

        <button onclick="calculate('sqrt')">√</button>
        <button onclick="calculate('square')">x²</button>
        <button onclick="calculate('power')">Power</button>

        <br>

        <button onclick="calculate('sin')">Sin</button>
        <button onclick="calculate('cos')">Cos</button>
        <button onclick="calculate('tan')">Tan</button>

        <h3 id="result">Result:</h3>

    </div>

    <script>

        function calculate(op) {

            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);
            let result;

            if (document.getElementById("num1").value === "" ||
                document.getElementById("num2").value === "") {
                alert("Enter both numbers");
                return;
            }

            if (op === '+')
                result = a + b;

            else if (op === '-')
                result = a - b;

            else if (op === '*')
                result = a * b;

            else if (op === '/') {
                if (b === 0) {
                    alert("Cannot divide by zero");
                    return;
                }
                result = a / b;
            }

            else if (op === 'sqrt')
                result = Math.sqrt(a);

            else if (op === 'square')
                result = a * a;

            else if (op === 'power')
                result = Math.pow(a, b);

            else if (op === 'sin')
                result = Math.sin(a * Math.PI / 180);

            else if (op === 'cos')
                result = Math.cos(a * Math.PI / 180);

            else if (op === 'tan')
                result = Math.tan(a * Math.PI / 180);

            document.getElementById("result").innerHTML =
                "Result: " + result;

        }

    </script>

</body>
</html>
