
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Form</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<style>
body { background:#f8f9fa; }
</style>
</head>

<body>

<main class="container py-5">
<div class="card shadow p-4 mx-auto" style="max-width:400px">

<h1 class="h4 text-center mb-4 fw-bold">Login Form</h1>

<form name="loginform" onsubmit="return validate()">

  <div class="mb-3">
    <label for="t1" class="form-label">Username</label>
    <input type="text" id="t1" name="t1" class="form-control">
  </div>

  <div class="mb-3">
    <label for="t2" class="form-label">Password</label>
    <input type="password" id="t2" name="t2" class="form-control">
  </div>

  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary">Submit</button>
    <button type="reset" class="btn btn-secondary">Clear</button>
  </div>

</form>
</div>
</main>

<script>
function validate() {

    var f = document.forms["loginform"];

    var u = f.elements["t1"].value;
    var p = f.elements["t2"].value;

    var userPattern = /^[A-Za-z0-9_]+$/;
    var passPattern = /^[A-Za-z0-9@#$]{6,}$/;

    if (u === "") {
        alert("Enter username");
        return false;
    }
    else if (!userPattern.test(u)) {
        alert("Invalid Username");
        return false;
    }
    else if (p === "") {
        alert("Enter password");
        return false;
    }
    else if (!passPattern.test(p)) {
        alert("Invalid Password");
        return false;
    }
    else {
        alert("Login Successful");
        return false;
    }
}
</script>

</body>
</html>
