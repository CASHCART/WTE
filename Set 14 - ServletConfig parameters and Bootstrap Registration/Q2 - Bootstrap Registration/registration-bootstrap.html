
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card p-4">

                    <h2 class="text-center text-primary">
                        Registration Form
                    </h2>

                    <form onsubmit="return validate()">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="username"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" id="confirm"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mobile Number</label>
                            <input type="text" id="phone"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="text" id="email"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" id="dob"
                                   class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label><br>

                            <input type="radio" name="gender" value="Male">
                            Male

                            <input type="radio" name="gender" value="Female">
                            Female
                        </div>

                        <div class="mb-3">
                            <label class="form-label">State</label>

                            <select id="state" class="form-select">
                                <option value="">Select State</option>
                                <option>Telangana</option>
                                <option>Andhra Pradesh</option>
                                <option>Karnataka</option>
                                <option>Tamil Nadu</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea id="address"
                                      class="form-control"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script>
        function validate() {

            let u = document.getElementById("username").value;
            let p = document.getElementById("password").value;
            let c = document.getElementById("confirm").value;
            let ph = document.getElementById("phone").value;
            let e = document.getElementById("email").value;
            let d = document.getElementById("dob").value;
            let s = document.getElementById("state").value;
            let a = document.getElementById("address").value;

            let userPattern = /^[A-Za-z0-9_]+$/;
            let passPattern = /^[A-Za-z0-9@#$]{6,}$/;
            let phonePattern = /^[0-9]{10}$/;
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (u === "" || p === "" || c === "" ||
                ph === "" || e === "" || d === "" ||
                s === "" || a.trim() === "") {
                alert("Please fill all fields");
                return false;
            }

            if (!userPattern.test(u)) {
                alert("Invalid Username");
                return false;
            }

            if (!passPattern.test(p)) {
                alert("Password must contain at least 6 characters");
                return false;
            }

            if (p !== c) {
                alert("Passwords do not match");
                return false;
            }

            if (!phonePattern.test(ph)) {
                alert("Enter valid 10 digit mobile number");
                return false;
            }

            if (!emailPattern.test(e)) {
                alert("Enter valid email");
                return false;
            }

            if (!document.querySelector('input[name="gender"]:checked')) {
                alert("Select Gender");
                return false;
            }

            alert("Registration Successful");
            return false;
        }
    </script>

</body>
</html>
